<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Letter Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10"
        flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Right Accent -->
  <rect x="468" y="40" width="24" height="108" rx="12" fill="#EF4444"/>
  <rect x="468" y="152" width="24" height="108" rx="12" fill="#F97316"/>
  <rect x="468" y="264" width="24" height="108" rx="12" fill="#FACC15"/>
  <rect x="468" y="376" width="24" height="96" rx="12" fill="#22C55E"/>

  <!-- Decorative Circles -->
  <circle cx="82" cy="82" r="22" fill="#38BDF8" opacity="0.7"/>
  <circle cx="430" cy="82" r="14" fill="#FFFFFF" opacity="0.3"/>

  <!-- Main Letter -->
  <text
    x="256"
    y="345"
    text-anchor="middle"
    font-family="Inter, Poppins, Arial, sans-serif"
    font-size="280"
    font-weight="900"
    fill="white"
    filter="url(#shadow)">
    A
  </text>
</svg>